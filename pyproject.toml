[project]
name = "cpgeo"
version = "1.0.11"
description = "A library for control points-based surface."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Song Zenan", email = "243919588@qq.com" }
]
dependencies = [
    "pypardiso>=0.4.7",
    "scipy>=1.15.0",
    "pyvista>=0.46.5",
    "numpy>=2.0.0",
    "networkx>=3.4.2",
]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.setuptools.package-data]
# 将 DLL 文件打包进去
cpgeo = [
    "*.dll",           # Windows
    "*.so",            # Linux
    "*.dylib",         # macOS
    "bin/*.dll",
    "bin/*.so",
    "bin/*.dylib",
    "lib/*.so",
    "lib/*.dylib",
]
